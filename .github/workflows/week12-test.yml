name: Week 12 Tests
on: [push, pull_request]

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install & Test API
        working-directory: ./labs/week-12/source/api
        run: |
          npm install
          npm test
